[tool.poetry]
name = "videocrawlerengine"
version = "0.1.0"
description = "A video crawler engine for various video platforms"
authors = ["VideoCrawlerEngine Contributors"]
readme = "README.md"
license = "MIT"
packages = [{include = "core"}, {include = "gui"}, {include = "handler"}, {include = "nbdler"}]

[tool.poetry.dependencies]
python = ">=3.8,<3.13"
altgraph = "^0.17"
beautifulsoup4 = "^4.12"
bs4 = "^0.0.1"
future = "^0.18"
macholib = "^1.16"
pefile = "^2023.2"
Pillow = "^10.0"
PyInstaller = "^6.0"
pyperclip = "^1.8"
pyrasite = "^2.0"
pywin32-ctypes = {version = "^0.2.0", markers = "sys_platform == 'win32'"}
six = "^1.16"
soupsieve = "^2.5"
wxPython = {version = "^4.2", markers = "sys_platform != 'linux'", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=core",
    "--cov=nbdler",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=0",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["core", "nbdler"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/test_*.py",
    "*_test.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true
fail_under = 0

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"